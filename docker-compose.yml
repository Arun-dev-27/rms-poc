services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rms-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Rms_Strong#2026"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./docker/mssql:/docker-init:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rms-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./docker/mssql:/docker-init:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "mssql", "-U", "sa", "-P", "Rms_Strong#2026", "-i", "/docker-init/init.sql"]
    restart: "no"

  redis:
    image: redis:7.4-alpine   # 7.4+ needed: HEXPIRE (TTL per request id)
    container_name: rms-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6395:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: rms-app
    profiles: ["app"]
    env_file: .env
    environment:
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SNAPSHOT_DIR: /app/snapshots
    ports:
      - "3000:3000"
    volumes:
      - ./snapshots:/app/snapshots
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  mssql-data:
  redis-data:
