# --- Persistence layer 1: RDB snapshots (point-in-time dump.rdb) ---
# save <seconds> <changes>
save 900 1
save 300 100
save 60 10000
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes

# --- Persistence layer 2: AOF (every write logged, fsync every second) ---
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

dir /data
maxmemory 2gb
# Cache holds the full master table: never evict silently
maxmemory-policy noeviction
